# Builds the firmware when a version tag is pushed and publishes it as a release.
# The box reads version.txt from the newest release and installs fjarrnyckel-update.bin from it.
name: Release firmware
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: The tag must match the firmware version
        run: |
          version=$(sed -n 's/^set(PROJECT_VER "\(.*\)")/\1/p' firmware/CMakeLists.txt)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, firmware $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build
        run: |
          pip install platformio
          cd firmware && pio run
      - name: Collect the files
        run: |
          b=firmware/.pio/build/fjarrnyckel
          mkdir release
          cp $b/firmware.bin release/fjarrnyckel-update.bin
          ~/.platformio/packages/tool-esptool/esptool --chip esp32s3 merge-bin -o release/fjarrnyckel-usb.bin --flash-mode dio --flash-freq 80m --flash-size 16MB \
            0x0 $b/bootloader.bin 0x8000 $b/partitions.bin 0xf000 $b/ota_data_initial.bin 0x20000 $b/firmware.bin
          echo "$VERSION" > release/version.txt
          grep -a -c -x "$VERSION" <(strings release/fjarrnyckel-update.bin)
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --title "Fjärrnyckel $VERSION" --generate-notes
