; Fjärrnyckel firmware: the operator's box of the remote CW keying link.
; Board: ESP32-S3-DevKitC-1 N16R8 (16 MB flash, 8 MB PSRAM). Framework: ESP-IDF.
[env:fjarrnyckel]
platform = espressif32@8.0.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.embed_files =
    src/page.html
    src/logo.png
