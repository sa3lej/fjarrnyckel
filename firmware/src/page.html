<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07253E">
<link rel="icon" href="/logo.png">
<link rel="apple-touch-icon" href="/logo.png">
<title>Fjärrnyckel</title>
<style>
:root{--night:#07253E;--deep:#051B2E;--panel:#0D3050;--line:#1D4468;--brass:#D9A441;--brass2:#F0C56A;--cream:#F4ECD8;--dim:#A9B8C6;--ok:#7BD389;--bad:#F08A7B}
*{box-sizing:border-box}
html{background:var(--deep)}
body{margin:0;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--cream);
 background:radial-gradient(120% 60% at 50% 0,#0E3A60 0,var(--night) 45%,var(--deep) 100%) fixed;min-height:100vh;-webkit-text-size-adjust:100%}
main{max-width:34rem;margin:0 auto;padding:calc(1.2rem + env(safe-area-inset-top)) 1rem 6.5rem}
.tab[hidden],.status[hidden]{display:none}#hWpmBox{margin-top:.9rem}.tab>h2:first-child{margin-top:.4rem}
nav#tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:center;gap:.2rem;background:#051B2EF2;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:.35rem .5rem calc(.35rem + env(safe-area-inset-bottom))}
nav#tabs[hidden]{display:none}
nav#tabs button{flex:1;max-width:8.5rem;position:relative;display:grid;justify-items:center;gap:.12rem;background:none;border:0;border-radius:12px;color:var(--dim);font:inherit;font-size:.72rem;line-height:1.2;padding:.4rem .2rem;cursor:pointer}
nav#tabs button.on{color:var(--brass2);background:#ffffff0d}
nav#tabs svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav#tabs .dot{position:absolute;top:.3rem;left:calc(50% + 8px);width:9px;height:9px;border-radius:50%;background:var(--bad);box-shadow:0 0 0 2px var(--deep);display:none}
nav#tabs button.warn .dot{display:block}nav#tabs button.note .dot{display:block;background:var(--brass)}
@media(min-width:760px){main{padding-bottom:3rem}nav#tabs{position:static;background:var(--deep);border:1px solid var(--line);border-radius:14px;padding:.3rem;margin:0 0 1.2rem}
 nav#tabs button{max-width:none;grid-auto-flow:column;justify-content:center;align-items:center;gap:.45rem;font-size:.9rem;padding:.55rem .4rem}nav#tabs svg{width:20px;height:20px}nav#tabs .dot{top:.35rem;left:auto;right:.5rem}}
.hero{padding:1.1rem 1rem;margin-bottom:.9rem}.hero .lamp{width:16px;height:16px}#hState{font-weight:700;font-size:1.08rem}#hDetail{color:var(--dim);font-size:.9rem}#hDetail:empty{display:none}
.rows{padding:.2rem 1rem}.row{display:flex;align-items:center;gap:.75rem;width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:inherit;font:inherit;text-align:left;padding:.8rem 0;cursor:pointer}
.row:last-child,.row.last{border-bottom:0}.row[hidden]{display:none}.rl{font-weight:600;white-space:nowrap}.rv{flex:1;min-width:0;text-align:right;color:var(--dim);font-size:.9rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.chev{color:var(--dim);font-size:1.3rem;line-height:1}
header{display:flex;align-items:center;gap:.9rem;margin:.4rem 0 1.3rem}
header img{width:76px;height:76px;border-radius:18px;box-shadow:0 8px 24px #0008,0 0 0 1px #ffffff14}
h1{font:600 1.75rem/1.1 Georgia,"Times New Roman",serif;letter-spacing:.01em;margin:0;color:var(--cream)}
header p{margin:.15rem 0 0;color:var(--dim);font-size:.92rem}
#lang{margin-left:auto;align-self:flex-start;background:none;border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:.25rem .7rem;font:inherit;font-size:.8rem;cursor:pointer}
.status{display:flex;gap:.8rem;align-items:center;background:linear-gradient(180deg,#123A5E,#0D3050);border:1px solid var(--line);border-radius:14px;padding:.9rem 1rem;box-shadow:0 6px 20px #0005}
.lamp{flex:none;width:12px;height:12px;border-radius:50%;background:var(--dim);box-shadow:0 0 0 4px #ffffff10}
.lamp.ok{background:var(--ok);box-shadow:0 0 0 4px #7bd38926,0 0 14px #7bd38988}
.lamp.busy{background:var(--brass);animation:pulse 1.1s infinite}
.lamp.bad{background:var(--bad);box-shadow:0 0 0 4px #f08a7b26}
@keyframes pulse{50%{opacity:.35}}
#state{font-weight:600}#detail{color:var(--dim);font-size:.9rem}
h2{font-size:.78rem;font-weight:600;line-height:1;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);margin:1.9rem .2rem .6rem}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:1rem;box-shadow:0 6px 20px #0004}
label{display:flex;justify-content:space-between;align-items:baseline;margin:1rem 0 .35rem;font-size:.93rem;color:var(--dim)}
label:first-child{margin-top:0}label b{color:var(--cream);font-weight:600;font-variant-numeric:tabular-nums}
input[type=text],input[type=password],select{width:100%;font:inherit;color:var(--cream);background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;outline:none}
select{cursor:pointer}input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}
.pw{position:relative}.pw button{position:absolute;right:.3rem;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--dim);font:inherit;font-size:.85rem;padding:.4rem .6rem;cursor:pointer}
.main{width:100%;box-sizing:border-box;margin-top:1rem;font-family:inherit;font-size:1rem;font-weight:600;line-height:1;color:#2A1B00;background:linear-gradient(180deg,var(--brass2),var(--brass));border:0;border-radius:10px;padding:.85rem;cursor:pointer;box-shadow:0 2px 0 #9a7222,0 6px 16px #0006}
.main:active{transform:translateY(1px);box-shadow:0 1px 0 #9a7222}
button.quiet{width:100%;font:inherit;color:var(--cream);background:none;border:1px solid var(--line);border-radius:10px;padding:.7rem;cursor:pointer}
#rig{margin-bottom:.9rem;padding:.9rem 1rem 1rem}.rigtop,.bandrow,.rigfoot{display:flex;align-items:center;justify-content:space-between;gap:.8rem}
.chips{display:flex;gap:.3rem}.chips button{font:inherit;font-size:.85rem;color:var(--dim);background:var(--deep);border:1px solid var(--line);border-radius:8px;padding:.32rem .6rem;cursor:pointer;font-variant-numeric:tabular-nums}
.chips button.on{color:#2A1B00;background:linear-gradient(180deg,var(--brass2),var(--brass));border-color:var(--brass);font-weight:600}
.dial{display:flex;align-items:stretch;gap:.5rem;margin:.7rem 0 .8rem;outline:none}
.dial .read{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center;gap:.5rem;background:linear-gradient(180deg,#03121F,#051B2E);border:1px solid var(--line);border-radius:12px;padding:.55rem .6rem;box-shadow:inset 0 2px 10px #000a}
.dial:focus-visible .read{border-color:var(--brass)}
#rigDigits{display:flex;align-items:baseline;font:600 clamp(1.7rem,8.4vw,2.5rem)/1.1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;color:var(--brass2);text-shadow:0 0 14px #f0c56a55;white-space:nowrap}
#rigDigits[hidden]{display:none}#rigDigits button{font:inherit;color:inherit;text-shadow:inherit;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;padding:0 .02em;margin:0;cursor:pointer}
#rigDigits button.on{border-bottom-color:var(--brass2)}#rigDigits .sep{opacity:.55;padding:0 .02em}
#rigGo{flex:1;min-width:0;border:0;background:none;padding:.25rem 0;font:600 1.5rem/1.2 ui-monospace,Menlo,Consolas,monospace;color:var(--brass2);text-align:center}
.dial .unit{font:inherit;font-size:.8rem;color:var(--dim);background:none;border:1px solid var(--line);border-radius:6px;padding:.1rem .4rem;cursor:pointer}
.nudge{flex:none;width:3rem;font-family:inherit;font-size:1.7rem;font-weight:500;line-height:1;color:var(--cream);background:var(--deep);border:1px solid var(--line);border-radius:12px;cursor:pointer;touch-action:none;-webkit-user-select:none;user-select:none}
.nudge:active{background:var(--line)}
#rigBands{flex:1;flex-wrap:wrap}#rigBands button{flex:1 0 2.2rem;padding:.32rem 0;text-align:center}#rigBands button[hidden],#rigTune[hidden]{display:none}
.rigfoot{margin-top:.8rem}#rigTip{flex:1}#rigTune{flex:none;font:inherit;font-size:.88rem;font-weight:600;color:var(--brass2);background:none;border:1px solid var(--brass);border-radius:8px;padding:.4rem .8rem;cursor:pointer}
#rigTune:disabled{opacity:.6}
@media(min-width:1000px){main{max-width:66rem}.tab:not([hidden]){columns:2;column-gap:1.4rem}.grp{break-inside:avoid;-webkit-column-break-inside:avoid;display:inline-block;width:100%;margin-bottom:1.1rem}
 .grp>h2{margin-top:.4rem}.grp>.hero,.grp>#rig{margin-bottom:0}}
.tab>.grp:first-child>h2{margin-top:.4rem}.grp:not(:has(> :not([hidden]))){display:none}
#nets{margin:.6rem 0 0;display:grid;gap:.4rem}
#nets button{display:flex;align-items:center;gap:.7rem;width:100%;font:inherit;color:var(--cream);background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:.65rem .8rem;cursor:pointer;text-align:left}
#nets button.sel{border-color:var(--brass);box-shadow:inset 0 0 0 1px var(--brass)}
#nets .n{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}#nets .o{color:var(--dim);font-size:.8rem}
.bars{display:flex;align-items:flex-end;gap:2px;height:14px}.bars i{width:3px;background:var(--line);border-radius:1px}.bars i.on{background:var(--brass2)}
.bars i:nth-child(1){height:5px}.bars i:nth-child(2){height:8px}.bars i:nth-child(3){height:11px}.bars i:nth-child(4){height:14px}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{font:inherit;color:var(--dim);background:none;border:0;border-radius:8px;padding:.6rem;cursor:pointer}
.seg button.on{color:#2A1B00;background:linear-gradient(180deg,var(--brass2),var(--brass));font-weight:600}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:none;margin:0}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--brass) var(--fill,50%),var(--deep) var(--fill,50%));border:1px solid var(--line)}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:var(--deep);border:1px solid var(--line)}
input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--brass)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cf,var(--brass) 60%,#9a7222);border:1px solid #6d4f12;box-shadow:0 2px 6px #0008}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3cf,var(--brass) 60%,#9a7222);border:1px solid #6d4f12}
.hint{color:var(--dim);font-size:.85rem;margin:.9rem 0 0}.hint:empty{display:none}
.mini{display:flex;gap:.8rem;align-items:center;background:var(--deep);border:1px solid var(--line);border-radius:10px;padding:.7rem .8rem;margin-bottom:.2rem}
#linkState,#tsState,#upState,#pwState{font-weight:600}#linkDetail,#tsDetail,#upDetail,#pwDetail{color:var(--dim);font-size:.88rem}#linkDetail:empty,#tsDetail:empty,#upDetail:empty{display:none}.bar{height:8px;border-radius:4px;background:var(--deep);border:1px solid var(--line);margin-top:.8rem;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brass),var(--brass2));transition:width .6s}#tsKeyBox label{margin-top:.9rem}
#paddleBox{margin-top:1.1rem}
footer{margin:2.2rem 0 0;text-align:center;color:#6f8498;font-size:.8rem}
.secret{-webkit-text-security:disc}.secret.shown{-webkit-text-security:none}
.lead{margin:0 0 .7rem;color:var(--dim);font-size:.93rem}.strong{font-weight:600}.sub{color:var(--dim);font-size:.88rem}.sub:empty{display:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.7rem}
.center{text-align:center;padding:.6rem 0 .2rem}.center .hint{margin:.5rem auto 0;max-width:24rem}
.spin{width:42px;height:42px;margin:.2rem auto .9rem;border-radius:50%;border:4px solid var(--line);border-top-color:var(--brass2);animation:turn .9s linear infinite}
@keyframes turn{to{transform:rotate(360deg)}}
.tick{width:46px;height:46px;margin:.2rem auto .8rem;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;font-weight:700;color:#06231a;background:var(--ok);box-shadow:0 0 0 6px #7bd38922}
.tick.bad{background:var(--bad);color:#3a0d06;box-shadow:0 0 0 6px #f08a7b22}.tick.wait{background:var(--brass);color:#2A1B00;box-shadow:0 0 0 6px #d9a44122}
a.link{display:block;text-decoration:none;text-align:center}a.main{color:#2A1B00}
.lead.big{color:var(--cream);font-weight:600;font-size:1rem}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<header>
 <img src="/logo.png" alt="" width="76" height="76">
 <div><h1>Fjärrnyckel</h1><p data-t="tagline"></p></div>
 <button id="lang" type="button"></button>
</header>
<nav id="tabs"><button type="button" data-tab="home"><svg viewBox="0 0 24 24"><path d="M4 11l8-7 8 7"/><path d="M6 10v9h12v-9"/></svg><span data-t="t_home"></span><i class="dot"></i></button><button type="button" data-tab="key"><svg viewBox="0 0 24 24"><path d="M3 18h18"/><path d="M5 18v-3h9l5-4"/><circle cx="19" cy="9" r="2"/><path d="M8 15v-2"/></svg><span data-t="t_key"></span><i class="dot"></i></button><button type="button" data-tab="net"><svg viewBox="0 0 24 24"><path d="M3 9a13 13 0 0 1 18 0"/><path d="M6.5 12.5a8 8 0 0 1 11 0"/><path d="M10 16a3 3 0 0 1 4 0"/><circle cx="12" cy="19" r=".6"/></svg><span data-t="t_net"></span><i class="dot"></i></button><button type="button" data-tab="box"><svg viewBox="0 0 24 24"><rect x="3.5" y="7" width="17" height="11" rx="2.5"/><path d="M8 11h3M8 14h8"/><circle cx="16.5" cy="11" r=".7"/></svg><span data-t="t_box"></span><i class="dot"></i></button></nav>

<div id="lock" hidden><div class="card"><div class="center">
 <div class="tick wait">🔒</div><div class="strong" data-t="lockT"></div><p class="hint" data-t="lockD"></p>
 <div class="pw" style="margin-top:1rem;text-align:left"><input id="lockPass" class="secret" type="text" name="fn-page" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"><button id="showlock" type="button"></button></div>
 <p class="hint" id="lockMsg" style="color:var(--bad)"></p>
 <button class="main" id="unlock" type="button"></button></div></div></div>
<div id="app">

<section class="tab" data-tab="home">
<div class="status hero" role="status"><span class="lamp" id="hLamp"></span><div><div id="hState">…</div><div id="hDetail"></div></div></div>
<div class="card" id="rig" hidden>
 <div class="rigtop"><span class="sub" id="rigName"></span><div class="chips" id="rigMode"><button type="button" data-v="3">CW</button><button type="button" data-v="1">USB</button><button type="button" data-v="0">LSB</button></div></div>
 <div class="dial" id="rigDial" tabindex="0"><button type="button" class="nudge" id="rigDn">−</button>
  <div class="read"><div id="rigDigits"></div><input id="rigGo" type="text" inputmode="decimal" autocomplete="off" hidden><button type="button" class="unit" id="rigUnit">MHz</button></div>
  <button type="button" class="nudge" id="rigUp">+</button></div>
 <div class="bandrow"><span class="sub" data-t="rigBand"></span><div class="chips" id="rigBands"></div></div>
 <div class="rigfoot"><span class="sub" id="rigTip"></span><button type="button" id="rigTune"></button></div>
</div>
<div class="card rows">
 <button class="row" type="button" data-go="net" id="rWifi"><span class="lamp"></span><span class="rl">Wi-Fi</span><span class="rv"></span><span class="chev">›</span></button>
 <button class="row" type="button" data-go="net" id="rTs"><span class="lamp"></span><span class="rl">Tailscale</span><span class="rv"></span><span class="chev">›</span></button>
 <button class="row" type="button" data-go="net" id="rLink"><span class="lamp"></span><span class="rl" data-t="link"></span><span class="rv"></span><span class="chev">›</span></button>
 <button class="row" type="button" data-go="box" id="rUp" hidden><span class="lamp busy"></span><span class="rl" data-t="software"></span><span class="rv"></span><span class="chev">›</span></button>
</div>
<h2 data-t="quick"></h2>
<div class="card">
 <label data-t="targetL"></label>
 <div class="seg" id="h_target"><button type="button" data-v="0" data-t="tRadio"></button><button type="button" data-v="1" data-t="tComputer"></button></div>
 <div id="hWpmBox"><label for="h_wpm"><span data-t="speed"></span><b><span id="h_wpmV"></span> WPM</b></label>
 <input id="h_wpm" type="range" min="5" max="60"></div>
 <label for="h_volume"><span data-t="volume"></span><b><span id="h_volumeV"></span></b></label>
 <input id="h_volume" type="range" min="0" max="100">
</div>
</section>

<section class="tab" data-tab="net" hidden>
<div class="status" role="status" hidden><span class="lamp" id="lamp"></span><div><div id="state">…</div><div id="detail"></div></div></div>

<h2 data-t="wifi"></h2>
<div class="card" id="wifiCard">
 <div id="wNow" hidden><div class="mini"><span class="lamp ok"></span><div><div class="strong" id="wNowT"></div><div class="sub" id="wNowD"></div><div class="sub" id="wNowS"></div></div></div>
  <button class="quiet" id="wChange" type="button" style="margin-top:.8rem"></button></div>
 <div id="wList" hidden><p class="lead" data-t="wPick"></p><div id="nets"></div>
  <div class="two"><button class="quiet" id="scan" type="button"></button><button class="quiet" id="wOther" type="button"></button></div></div>
 <div id="wKnown" hidden style="margin-top:1.1rem"><label data-t="wKnownL"></label><div id="known"></div><p class="hint" data-t="wKnownHint"></p></div>
 <div id="wPass" hidden><p class="lead" id="wPassT"></p>
  <div id="wNameBox"><label for="ssid" data-t="netName"></label>
   <input id="ssid" type="text" name="fn-network" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"></div>
  <label for="pass" data-t="password"></label>
  <div class="pw"><input id="pass" class="secret" type="text" name="fn-phrase" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"><button id="showpw" type="button"></button></div>
  <button class="main" id="join" type="button"></button>
  <button class="quiet" id="wBack" type="button" style="margin-top:.6rem"></button></div>
 <div id="wBusy" hidden class="center"><div class="spin"></div><div class="strong" id="wBusyT"></div><p class="hint" data-t="wBusyD"></p></div>
 <div id="wDone" hidden class="center"><div class="tick">✓</div><div class="strong" id="wDoneT"></div><p class="hint" id="wDoneD"></p>
  <a class="main link" id="wOpen" href="http://fjarrnyckel.local/">fjarrnyckel.local</a></div>
 <div id="wFail" hidden class="center"><div class="tick bad">!</div><div class="strong" id="wFailT"></div><p class="hint" id="wFailD"></p>
  <button class="main" id="wRetry" type="button"></button></div>
 <div id="wLost" hidden class="center"><div class="tick wait">…</div><div class="strong" data-t="wLostT"></div><p class="hint" id="wLostD"></p>
  <a class="main link" href="http://fjarrnyckel.local/">fjarrnyckel.local</a></div>
</div>

<h2>Tailscale</h2>
<div class="card" id="tsCard">
 <div class="mini"><span class="lamp" id="tsLamp"></span><div><div id="tsState"></div><div id="tsDetail"></div></div></div>
 <div id="tsOffBox" hidden><p class="hint" data-t="tsWhy"></p>
  <div id="tsKeyBox" hidden><label for="tsKey" data-t="tsKey"></label>
   <div class="pw"><input id="tsKey" class="secret" type="text" name="fn-tskey" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"><button id="showts" type="button"></button></div>
   <p class="hint" data-t="tsKeyHint"></p></div>
  <button class="main" id="tsOn" type="button"></button>
  <button class="quiet" id="tsKeyToggle" type="button" style="margin-top:.6rem"></button></div>
 <div id="tsLoginBox" hidden><a class="main link" id="tsLogin" target="_blank" rel="noopener"></a><p class="hint" data-t="tsLoginHint"></p></div>
 <div id="tsOnBox" hidden><label for="tsRegion" data-t="relayL"></label><select id="tsRegion"></select><p class="hint" id="relayHint"></p><div class="two" style="margin-top:.9rem"><button class="quiet" id="tsOff" type="button"></button><button class="quiet" id="tsForget" type="button"></button></div></div>
</div>

<h2 data-t="link"></h2>
<div class="card">
 <div class="mini"><span class="lamp" id="linkLamp"></span><div><div id="linkState"></div><div id="linkDetail"></div></div></div>
 <p class="hint" id="keyStat"></p>
 <label for="lhost" data-t="lhost"></label>
 <input id="lhost" type="text" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false">
 <label for="lport" data-t="lport"></label>
 <input id="lport" type="text" inputmode="numeric" autocomplete="off">
 <label for="lkey" data-t="lkey"></label>
 <div class="pw"><input id="lkey" class="secret" type="text" name="fn-linkkey" autocapitalize="none" autocorrect="off" autocomplete="off" spellcheck="false"><button id="showkey" type="button"></button></div>
 <p class="hint" data-t="lhint"></p>
 <button class="main" id="lsave" type="button"></button>

 for(const[id,v]of[["lhost",S.linkHost],["lport",""+S.linkPort]]){const e=$(id);if(base[id]===undefined||(document.activeElement!=e&&e.value===base[id])){e.value=v;base[id]=v}}
 show()}
async function status(){try{const r=await fetch("/api/status",{cache:"no-store"});if(r.status==401){locked=true;S=null;paint();return}locked=false;S=await r.json();
 absorb();if(!loaded){loaded=true;if(!location.hash&&S.wifi!="connected")go("net",true)}W.misses=0}catch(e){S=null;W.misses++}wifiStep();paint()}
// A slider sends its value while it is dragged. Only one request per slider is on its way at a time and the newest
// value always goes last; otherwise two could overtake each other and the setting would jump back and forth.
const live={};
function slide(k,save){const q=live[k]||(live[k]={busy:false,next:null});const d={[k]:$(k).value};if(save)d.save=1;
 if(q.busy){q.next=q.next&&q.next.save?{...d,save:1}:d;return}
 q.busy=true;post("/api/settings",d).catch(()=>{}).finally(()=>{q.busy=false;if(q.next){const n=q.next;q.next=null;$(k).value=n[k];slide(k,n.save)}})}
for(const k of SLIDERS){$(k).oninput=()=>{touched[k]=Date.now();show();slide(k,false)};$(k).onchange=()=>{touched[k]=Date.now();slide(k,true)}}
for(const k of SEGS)$(k).querySelectorAll("button").forEach(b=>b.onclick=()=>{touched[k]=Date.now();cur[k]=+b.dataset.v;show();post("/api/settings",{[k]:cur[k],save:1}).catch(()=>{})});
$("rigMode").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.mode=+b.dataset.v;paintRig();post("/api/radio",{mode:b.dataset.v}).catch(()=>{})});
const rigNudge=d=>rigFreq(Math.round(rigNow()/10)*10+d*rigStep);
for(const[id,d]of[["rigDn",-1],["rigUp",1]]){const b=$(id);let hold=0,rep=0;const stop=()=>{clearTimeout(hold);clearInterval(rep)};
 b.onpointerdown=e=>{e.preventDefault();rigNudge(d);hold=setTimeout(()=>rep=setInterval(()=>rigNudge(d),130),400)};b.onpointerup=b.onpointerleave=b.onpointercancel=stop}
$("rigDial").addEventListener("wheel",e=>{if(rigEdit)return;e.preventDefault();rigNudge(e.deltaY<0?1:-1)},{passive:false});
$("rigDial").onkeydown=e=>{if(rigEdit)return;const k=e.key;if(k=="ArrowUp"||k=="ArrowDown"){e.preventDefault();rigNudge(k=="ArrowUp"?1:-1)}
 else if(k=="ArrowLeft"||k=="ArrowRight"){e.preventDefault();rigStep=Math.min(1e9,Math.max(10,k=="ArrowLeft"?rigStep*10:rigStep/10));paintRig()}};
for(const band of BANDS){const b=document.createElement("button");b.type="button";b.dataset.b=band[0];b.textContent=band[0];
 b.onclick=()=>{const cw=S.mode==3||S.mode==7,home=cw?band[3]:band[4];let was=0;try{was=+localStorage["fnBand"+band[0]]||0}catch(e){}
  rigFreq(bandOf(rigNow())==band||!was?home:was)};$("rigBands").append(b)}
// Typing a frequency: press "MHz", type, Enter. 7.030 and 7030 both mean 7.030 MHz.
const rigType=on=>{rigEdit=on;paintRig();if(on){$("rigGo").value="";$("rigGo").focus()}};
$("rigUnit").onclick=()=>rigType(!rigEdit);
$("rigGo").onkeydown=e=>{if(e.key=="Escape")rigType(false);if(e.key!="Enter")return;const v=parseFloat($("rigGo").value.replace(",","."));if(v>0)rigFreq(v>=1000?v*1e3:v*1e6);rigType(false)};
$("rigGo").onblur=()=>{if(rigEdit)rigType(false)};
$("rigTune").onclick=()=>{tuneAt=Date.now();paintRig();post("/api/radio",{tune:1}).catch(()=>{})};
$("bufTryB").onclick=()=>{$("buffer").value=$("bufTryB").dataset.ms;touched.buffer=Date.now();show();slide("buffer",true)};
$("beep").onclick=()=>post("/api/settings",{beep:1}).catch(()=>{});
$("showpw").onclick=()=>{$("pass").classList.toggle("shown");texts()};
$("showkey").onclick=()=>{$("lkey").classList.toggle("shown");texts()};
$("lsave").onclick=async()=>{delete base.lhost;delete base.lport;await post("/api/link",{host:$("lhost").value.trim(),port:$("lport").value.trim(),key:$("lkey").value.trim()}).catch(()=>{});$("lkey").value="";$("lsave").textContent=t("lsaved");setTimeout(texts,1500);status()};
$("showts").onclick=()=>{$("tsKey").classList.toggle("shown");texts()};
$("tsKeyToggle").onclick=()=>{$("tsKeyBox").hidden=false;$("tsKeyToggle").hidden=true;$("tsKey").focus()};
$("usbKb").onclick=async()=>{await post("/api/usb/keyboard",{}).catch(()=>{});status()};
const tsPost=async d=>{await post("/api/tailscale",d).catch(()=>{});$("tsKey").value="";status()};
$("tsOn").onclick=()=>tsPost({on:1,key:$("tsKey").value.trim()});
$("tsOff").onclick=()=>tsPost({on:0});
$("tsRegion").onchange=()=>{S.tsRegion=+$("tsRegion").value;tsPost({region:S.tsRegion})};
$("tsForget").onclick=()=>{if(confirm(t("tsForgetAsk")))tsPost({on:1,forget:1})};
$("upCheck").onclick=()=>post("/api/update/online",{check:1}).then(status).catch(()=>{});
$("upInstall").onclick=()=>{upBusy=true;post("/api/update/online",{install:1}).then(status).catch(()=>{})};
$("showlock").onclick=()=>{$("lockPass").classList.toggle("shown");texts()};
$("showpwn").onclick=()=>{$("pwNew").classList.toggle("shown");texts()};
$("unlock").onclick=async()=>{const r=await post("/api/login",{pass:$("lockPass").value}).catch(()=>null);if(r&&r.ok){$("lockPass").value="";$("lockMsg").textContent="";status()}else $("lockMsg").textContent=t("lockWrong")};
$("lockPass").onkeydown=e=>{if(e.key=="Enter")$("unlock").click()};
$("pwSet").onclick=async()=>{const p=$("pwNew").value;if(!p)return $("pwNew").focus();await post("/api/password",{pass:p}).catch(()=>{});$("pwNew").value="";status()};
$("pwOff").onclick=async()=>{if(!confirm(t("pwOffAsk")))return;await post("/api/password",{pass:""}).catch(()=>{});status()};
$("pick").onclick=()=>$("fw").click();
// Backups: the box seals them with the passphrase; the page only carries the file to and from the computer.
const bkMsg=(k,e)=>{$("bkMsg").style.color=k=="bkMade"||k=="bkDone"?"var(--ok)":k=="bkMaking"||k=="bkOpening"?"":"var(--bad)";$("bkMsg").textContent=k?t(k).replace("{e}",e||""):""};
const bkBusy=b=>{$("bkSave").disabled=$("bkLoad").disabled=b};
$("showbk").onclick=()=>{$("bkPass").classList.toggle("shown");texts()};
$("bkSave").onclick=async()=>{const pass=$("bkPass").value;if(!pass){bkMsg("bkNoPass");$("bkPass").focus();return}
 bkBusy(true);bkMsg("bkMaking");
 try{const r=await post("/api/backup",{pass});if(!r.ok)throw new Error((await r.json().catch(()=>({}))).error||r.status);
  const url=URL.createObjectURL(await r.blob()),a=document.createElement("a");a.href=url;a.download="fjarrnyckel-"+new Date().toISOString().slice(0,10)+".fnb";document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),10000);bkMsg("bkMade")}
 catch(e){bkMsg("bkFail",e.message)}finally{bkBusy(false)}};
$("bkLoad").onclick=()=>{if(!$("bkPass").value){bkMsg("bkNoPass");$("bkPass").focus();return}$("bkFile").click()};
$("bkFile").onchange=async()=>{const f=$("bkFile").files[0];$("bkFile").value="";if(!f||!confirm(t("bkAsk")))return;
 bkBusy(true);bkMsg("bkOpening");
 try{const b=new Uint8Array(await f.arrayBuffer()),data=Array.from(b,x=>x.toString(16).padStart(2,"0")).join("");
  const r=await post("/api/restore",{pass:$("bkPass").value,data});
  if(r.ok){bkMsg("bkDone");$("bkPass").value="";return}
  const e=(await r.json().catch(()=>({}))).error;bkMsg(r.status==403?"bkWrong":e=="not a backup"?"bkNot":"bkFail",e||r.status)}
 catch(e){bkMsg("bkFail",e.message)}finally{bkBusy(false)}};
$("fw").onchange=()=>{const f=$("fw").files[0];if(!f)return;const x=new XMLHttpRequest(),m=$("upMsg");x.open("POST","/api/update");
 x.upload.onprogress=e=>{m.textContent=t("upBusy").replace("{n}",Math.round(e.loaded/e.total*100))};
 x.onload=()=>{if(x.status==200){m.textContent=t("upDone");setTimeout(()=>location.reload(),12000)}else{let r="";try{r=JSON.parse(x.responseText).error}catch(e){}m.textContent=t("upFail")+(T[L].upErr[r]||r)}};
 x.onerror=()=>{m.textContent=t("upFail")+T[L].upErr["the upload was interrupted"]};x.send(f);$("fw").value=""};
$("lang").onclick=()=>{L=L=="sv"?"en":"sv";localStorage.fnLang=L;texts()};
// The Wi-Fi section shows one step at a time: the current network, the list, the password, progress, the result.
const fill=(k)=>t(k).replaceAll("{s}",W.ssid).replace("{ip}",S?S.ip:"");
function view(v){W.view=v;paintWifi()}
function paintWifi(){for(const k of["Now","List","Pass","Busy","Done","Fail","Lost"])$("w"+k).hidden=W.view!=k.toLowerCase();
 if(W.view=="now"&&S){W.ssid=S.ssid;$("wNowT").textContent=fill("sOkW");$("wNowD").textContent=fill("wNowD");
  $("wNowS").textContent=S.rssi?t("wSig").replace("{q}",t(S.rssi>-60?"sigStrong":S.rssi>-70?"sigGood":S.rssi>-80?"sigFair":"sigWeak")).replace("{n}",S.rssi):""}
 paintKnown();
 if(W.view=="pass"){$("wNameBox").hidden=!W.manual;$("wPassT").textContent=W.manual?t("wManual"):fill(W.open?"wOpenNet":"wPassFor");$("pass").closest(".pw").hidden=W.open&&!W.manual;$("pass").closest(".pw").previousElementSibling.hidden=!W.manual;$("wPassT").classList.toggle("big",!W.manual)}
 if(W.view=="busy")$("wBusyT").textContent=fill("wBusyT");
 if(W.view=="done"){$("wDoneT").textContent=fill("wDoneT");$("wDoneD").textContent=fill("wDoneD")}
 if(W.view=="fail"&&S){$("wFailT").textContent=fill("wFailT");$("wFailD").textContent=(T[L].r[S.joinFailed==W.ssid?S.joinReason:S.reason]||"")+" "+t("dBad")}
 if(W.view=="lost")$("wLostD").textContent=fill("wLostD")}
// The networks the box knows, each with a button to forget it. Rebuilt only when something in it changed.
let knownKey="";
function paintKnown(){const nets=S&&S.nets||[];$("wKnown").hidden=!nets.length||!(W.view=="now"||W.view=="list");
 const key=JSON.stringify(nets)+"|"+(S?S.ssid+S.wifi:"")+L;if(key==knownKey)return;knownKey=key;$("known").textContent="";
 for(const n of nets){const row=document.createElement("div");row.style.cssText="display:flex;align-items:center;gap:.8rem;margin-top:.5rem";
  const name=document.createElement("span");name.style.cssText="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap";
  name.textContent=n+(S.wifi=="connected"&&S.ssid==n?" · "+t("wInUse"):"");
  const b=document.createElement("button");b.type="button";b.className="quiet";b.style.cssText="width:auto;padding:.45rem .9rem";b.textContent=t("wForget");
  b.onclick=async()=>{if(!confirm(t("wForgetAsk").replace("{s}",n)))return;await post("/api/wifi/forget",{ssid:n}).catch(()=>{});status()};
  row.append(name,b);$("known").append(row)}}
// Called after every status reading: moves the section on when the box reports the outcome.
function wifiStep(){const age=Date.now()-W.since;
 if(W.view=="busy"){if(S&&S.ssid==W.ssid&&S.wifi=="connected")view("done");else if(S&&age>4000&&(S.joinFailed==W.ssid||(S.ssid==W.ssid&&S.wifi=="failed")))view("fail");else if(!S&&W.misses>=12)view("lost")}
 else if(W.view=="lost"&&S){if(S.wifi=="connected")view("done");else if(S.wifi=="failed")view("fail")}
 else if(W.view==""&&S){if(S.wifi=="connected")view("now");else{view("list");scan()}}
 else if(W.view=="now"&&S&&S.wifi!="connected"&&age>4000){view("list");scan()}
 else paintWifi()}
async function scan(){scanState="scanning";texts();$("nets").textContent="";
 try{const list=await(await fetch("/api/scan")).json();list.sort((a,b)=>b.rssi-a.rssi);
  for(const n of list){const b=document.createElement("button");b.type="button";
   const bars=document.createElement("span");bars.className="bars";const lvl=n.rssi>-55?4:n.rssi>-67?3:n.rssi>-78?2:1;for(let i=1;i<=4;i++){const x=document.createElement("i");if(i<=lvl)x.className="on";bars.append(x)}
   const name=document.createElement("span");name.className="n";name.textContent=n.ssid;b.append(bars,name);
   if(n.open){const o=document.createElement("span");o.className="o";o.textContent=t("open");b.append(o)}
   b.onclick=()=>{W.ssid=n.ssid;W.open=n.open;W.manual=false;$("ssid").value=n.ssid;$("pass").value="";view("pass");if(!n.open)$("pass").focus()};$("nets").append(b)}
  if(!list.length)$("nets").textContent=t("none")}catch(e){$("nets").textContent=t("scanFail")}
 scanState="scanAgain";texts()}
$("scan").onclick=scan;
$("wOther").onclick=()=>{W.ssid="";W.open=false;W.manual=true;$("ssid").value="";$("pass").value="";view("pass");$("ssid").focus()};
$("wBack").onclick=()=>view("list");
$("wChange").onclick=()=>{view("list");scan()};
$("wRetry").onclick=()=>{view("pass");if(!W.open)$("pass").focus()};
$("join").onclick=async()=>{if(W.manual)W.ssid=$("ssid").value.trim();if(!W.ssid)return $("ssid").focus();
 document.activeElement&&document.activeElement.blur();W.since=Date.now();W.misses=0;view("busy");$("wifiCard").scrollIntoView({block:"center",behavior:"smooth"});
 await post("/api/wifi",{ssid:W.ssid,pass:W.open&&!W.manual?"":$("pass").value}).catch(()=>{})};
$("tabs").querySelectorAll("button").forEach(b=>b.onclick=()=>go(b.dataset.tab));
document.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>go(b.dataset.go));
$("h_target").querySelectorAll("button").forEach(b=>b.onclick=()=>$("target").querySelector('[data-v="'+b.dataset.v+'"]').click());
for(const k of["wpm","volume"]){$("h_"+k).oninput=()=>{$(k).value=$("h_"+k).value;$(k).oninput()};$("h_"+k).onchange=()=>{$(k).value=$("h_"+k).value;$(k).onchange()}}
for(const tabEl of document.querySelectorAll(".tab")){let g=null;for(const e of[...tabEl.children]){if(e.tagName=="H2"||!g||g.dataset.done){g=document.createElement("div");g.className="grp";tabEl.insertBefore(g,e)}
  g.append(e);if(e.tagName!="H2")g.dataset.done=1}}
go(["home","key","net","box"].includes(location.hash.slice(1))?location.hash.slice(1):"home",true);
texts();status();setInterval(status,1500);
</script>
